---
# Homebrew itself is bootstrapped by setup.sh (needs sudo for /opt/homebrew),
# everything here runs as the normal user.

- name: Tap external Homebrew repositories
  community.general.homebrew_tap:
    name: "{{ item }}"
    state: present
  with_items:
    - anomalyco/tap # opencode

- name: Install essential development packages via Homebrew
  community.general.homebrew:
    name: "{{ item }}"
    state: present
  with_items:
    # Shell & prompt
    - antidote # zsh plugin manager (used in .zshrc)
    - oh-my-posh # prompt theme engine (used in .zshrc)
    - bat
    - bottom
    - direnv
    - fd
    - figlet
    - fzf
    - fastfetch
    - ripgrep
    - stow
    - tmux
    - tree
    - watch
    - wget
    - zoxide
    # Editors
    - neovim
    - ast-grep
    - lua
    - luarocks
    # Git & GitHub
    - git
    - gh
    - lazygit
    # Containers & Kubernetes
    - colima
    - docker
    - docker-buildx
    - docker-completion
    - docker-compose
    - lazydocker
    - helm
    - kind
    - k9s
    - kubernetes-cli
    # Cloud & infra
    - awscli
    - pulumi
    - certbot
    - unbound
    # Languages & tooling
    - cmake
    - uv
    - yarn
    # Media & docs
    - ffmpeg
    - ghostscript
    - poppler
    - latexml
    - p7zip
    # Databases & services
    - redis
    # AI CLIs
    - anomalyco/tap/opencode

- name: Install GUI apps using Homebrew Cask
  community.general.homebrew_cask:
    name: "{{ item }}"
    state: present
  with_items:
    # Terminals
    - kitty
    - ghostty
    # Editors
    - visual-studio-code@insiders
    # Window management & UX
    - aerospace
    - linearmouse
    - maccy
    - stats
    # Browsers
    - arc
    - google-chrome
    # Security
    - 1password
    - 1password-cli
    - session-manager-plugin # AWS SSM
    # Dev tools
    - beekeeper-studio
    - android-platform-tools
    # Fonts
    - font-jetbrains-mono-nerd-font
    - font-fira-code-nerd-font
    # Other
    - spotify
    - whatsapp@beta
    - mactex
