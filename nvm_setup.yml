---
# Installs NVM into ~/.nvm. The shell integration already lives in the
# dotfiles repo (zsh/.zshrc), so nothing is appended to ~/.zshrc here —
# that file is a stow-managed symlink and must stay identical to the repo.
- name: Download and install NVM
  ansible.builtin.shell: >
    curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash
  args:
    creates: "{{ ansible_env.HOME }}/.nvm/nvm.sh"

- name: Install latest LTS Node.js using NVM
  ansible.builtin.shell: . "$HOME/.nvm/nvm.sh" && nvm install --lts
